  <!-- n8n -->
  <g class="s18" transform="translate(720,152)">
    <rect width="78" height="92" rx="12" fill="#0d1117" stroke="#ea4b71" stroke-width="1.3"/>
    <g transform="translate(13,10)"><g clip-path="url(#rr)">
      <rect width="52" height="52" rx="12" fill="#ea4b71"/>
      <g class="spin" transform="translate(26,26)">
        <text font-family="'Fira Code',monospace" font-weight="700" font-size="16" fill="#fff" x="-16" y="7">n8n</text>
      </g>
    </g></g>
    <text x="39" y="80" text-anchor="middle" class="lbl">n8n</text>
  </g>

</svg>
