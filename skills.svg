<svg width="800" height="320" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <style>
      .section-title {
        font-family: monospace;
        font-size: 20px;
        font-weight: bold;
        fill: #ffffff;
      }
      .skill-label {
        font-family: monospace;
        font-size: 11px;
        fill: #8b949e;
      }
      .skill-box {
        rx: 10;
        fill: #161b22;
        stroke: #30363d;
        stroke-width: 1;
      }
      .skill-box:hover {
        stroke: #58a6ff;
      }

      .pop-1 { animation: popIn 0.5s ease-out 0.2s both; }
      .pop-2 { animation: popIn 0.5s ease-out 0.35s both; }
      .pop-3 { animation: popIn 0.5s ease-out 0.5s both; }
      .pop-4 { animation: popIn 0.5s ease-out 0.65s both; }
      .pop-5 { animation: popIn 0.5s ease-out 0.8s both; }
      .pop-6 { animation: popIn 0.5s ease-out 0.95s both; }
      .pop-7 { animation: popIn 0.5s ease-out 1.1s both; }
      .pop-8 { animation: popIn 0.5s ease-out 1.25s both; }
      .pop-9 { animation: popIn 0.5s ease-out 1.4s both; }
      .pop-10 { animation: popIn 0.5s ease-out 1.55s both; }
      .pop-11 { animation: popIn 0.5s ease-out 1.7s both; }
      .pop-12 { animation: popIn 0.5s ease-out 1.85s both; }
      .pop-13 { animation: popIn 0.5s ease-out 2.0s both; }
      .pop-14 { animation: popIn 0.5s ease-out 2.15s both; }
      .pop-15 { animation: popIn 0.5s ease-out 2.3s both; }
      .pop-16 { animation: popIn 0.5s ease-out 2.45s both; }
      .pop-17 { animation: popIn 0.5s ease-out 2.6s both; }
      .pop-18 { animation: popIn 0.5s ease-out 2.75s both; }

      .rotate-logo { animation: rotateSlow 12s linear infinite; transform-box: fill-box; transform-origin: center; }
      .glow-pulse { animation: glowBlink 3s ease-in-out infinite; }

      @keyframes popIn {
        0% { opacity: 0; transform: scale(0.5); }
        70% { transform: scale(1.1); }
        100% { opacity: 1; transform: scale(1); }
      }
      @keyframes rotateSlow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes glowBlink {
        0%, 100% { filter: drop-shadow(0 0 3px #58a6ff44); }
        50% { filter: drop-shadow(0 0 10px #58a6ffaa); }
      }
    </style>
  </defs>

  <rect width="800" height="320" fill="#0d1117" rx="10"/>

  <!-- Section Title -->
  <text x="20" y="35" class="section-title glow-pulse">&lt;/&gt; Skills</text>

  <!-- Row 1 -->
  <!-- Python -->
  <g class="pop-1 glow-pulse" transform="translate(20, 55)">
    <rect width="70" height="70" rx="12" fill="#1a2332" stroke="#3572A5" stroke-width="1.5"/>
    <g class="rotate-logo" transform="translate(35,30)">
      <circle r="18" fill="#3572A5"/>
      <text x="-8" y="6" font-size="14" fill="white" font-weight="bold">Py</text>
    </g>
    <text x="35" y="62" text-anchor="middle" class="skill-label">Python</text>
  </g>

  <!-- NumPy -->
  <g class="pop-2 glow-pulse" transform="translate(100, 55)">
    <rect width="70" height="70" rx="12" fill="#1a2332" stroke="#4DABCF" stroke-width="1.5"/>
    <g class="rotate-logo" transform="translate(35,30)">
      <rect x="-16" y="-16" width="32" height="32" rx="4" fill="#4DABCF"/>
      <text x="-9" y="6" font-size="13" fill="white" font-weight="bold">Np</text>
    </g>
    <text x="35" y="62" text-anchor="middle" class="skill-label">NumPy</text>
  </g>

  <!-- Pandas -->
  <g class="pop-3 glow-pulse" transform="translate(180, 55)">
    <rect width="70" height="70" rx="12" fill="#1a2332" stroke="#e70488" stroke-width="1.5"/>
    <g class="rotate-logo" transform="translate(35,30)">
      <rect x="-16" y="-16" width="32" height="32" rx="4" fill="#e70488"/>
      <text x="-10" y="6" font-size="13" fill="white" font-weight="bold">Pd</text>
    </g>
    <text x="35" y="62" text-anchor="middle" class="skill-label">Pandas</text>
  </g>

  <!-- Git -->
  <g class="pop-4 glow-pulse" transform="translate(260, 55)">
    <rect width="70" height="70" rx="12" fill="#1a2332" stroke="#F05032" stroke-width="1.5"/>
    <g class="rotate-logo" transform="translate(35,30)">
      <rect x="-16" y="-16" width="32" height="32" rx="4" fill="#F05032"/>
      <text x="-10" y="6" font-size="11" fill="white" font-weight="bold">Git</text>
    </g>
    <text x="35" y="62" text-anchor="middle" class="skill-label">Git</text>
  </g>

  <!-- Docker -->
  <g class="pop-5 glow-pulse" transform="translate(340, 55)">
    <rect width="70" height="70" rx="12" fill="#1a2332" stroke="#2496ED" stroke-width="1.5"/>
    <g class="rotate-logo" transform="translate(35,30)">
      <rect x="-16" y="-16" width="32" height="32" rx="4" fill="#2496ED"/>
      <text x="-12" y="6" font-size="10" fill="white" font-weight="bold">🐳</text>
    </g>
    <text x="35" y="62" text-anchor="middle" class="skill-label">Docker</text>
  </g>

  <!-- Kubernetes -->
  <g class="pop-6 glow-pulse" transform="translate(420, 55)">
    <rect width="70" height="70" rx="12" fill="#1a2332" stroke="#326CE5" stroke-width="1.5"/>
    <g class="rotate-logo" transform="translate(35,30)">
      <circle r="18" fill="#326CE5"/>
      <text x="-6" y="6" font-size="13" fill="white" font-weight="bold">K8</text>
    </g>
    <text x="35" y="62" text-anchor="middle" class="skill-label">Kubernetes</text>
  </g>

  <!-- C++ -->
  <g class="pop-7 glow-pulse" transform="translate(500, 55)">
    <rect width="70" height="70" rx="12" fill="#1a2332" stroke="#00599C" stroke-width="1.5"/>
    <g class="rotate-logo" transform="translate(35,30)">
      <circle r="18" fill="#00599C"/>
      <text x="-10" y="6" font-size="12" fill="white" font-weight="bold">C++</text>
    </g>
    <text x="35" y="62" text-anchor="middle" class="skill-label">C++</text>
  </g>

  <!-- JavaScript -->
  <g class="pop-8 glow-pulse" transform="translate(580, 55)">
    <rect width="70" height="70" rx="12" fill="#1a2332" stroke="#F7DF1E" stroke-width="1.5"/>
    <g class="rotate-logo" transform="translate(35,30)">
      <rect x="-16" y="-16" width="32" height="32" rx="4" fill="#F7DF1E"/>
      <text x="-8" y="6" font-size="12" fill="black" font-weight="bold">JS</text>
    </g>
    <text x="35" y="62" text-anchor="middle" class="skill-label">JavaScript</text>
  </g>

  <!-- Row 2 -->
  <!-- React -->
  <g class="pop-9 glow-pulse" transform="translate(20, 140)">
    <rect width="70" height="70" rx="12" fill="#1a2332" stroke="#61DAFB" stroke-width="1.5"/>
    <g class="rotate-logo" transform="translate(35,30)">
      <circle r="18" fill="#20232a"/>
      <text x="-10" y="6" font-size="12" fill="#61DAFB" font-weight="bold">⚛️</text>
    </g>
    <text x="35" y="62" text-anchor="middle" class="skill-label">React</text>
  </g>

  <!-- Node.js -->
  <g class="pop-10 glow-pulse" transform="translate(100, 140)">
    <rect width="70" height="70" rx="12" fill="#1a2332" stroke="#339933" stroke-width="1.5"/>
    <g class="rotate-logo" transform="translate(35,30)">
      <circle r="18" fill="#339933"/>
      <text x="-10" y="6" font-size="11" fill="white" font-weight="bold">Node</text>
    </g>
    <text x="35" y="62" text-anchor="middle" class="skill-label">Node.js</text>
  </g>

  <!-- n8n -->
  <g class="pop-11 glow-pulse" transform="translate(180, 140)">
    <rect width="70" height="70" rx="12" fill="#1a2332" stroke="#ea4b71" stroke-width="1.5"/>
    <g class="rotate-logo" transform="translate(35,30)">
      <rect x="-16" y="-16" width="32" height="32" rx="4" fill="#ea4b71"/>
      <text x="-10" y="6" font-size="13" fill="white" font-weight="bold">n8n</text>
    </g>
    <text x="35" y="62" text-anchor="middle" class="skill-label">n8n</text>
  </g>

  <!-- Notion -->
  <g class="pop-12 glow-pulse" transform="translate(260, 140)">
    <rect width="70" height="70" rx="12" fill="#1a2332" stroke="#ffffff44" stroke-width="1.5"/>
    <g class="rotate-logo" transform="translate(35,30)">
      <rect x="-16" y="-16" width="32" height="32" rx="4" fill="#ffffff"/>
      <text x="-8" y="6" font-size="13" fill="black" font-weight="bold">N</text>
    </g>
    <text x="35" y="62" text-anchor="middle" class="skill-label">Notion</text>
  </g>

  <!-- AWS -->
  <g class="pop-13 glow-pulse" transform="translate(340, 140)">
    <rect width="70" height="70" rx="12" fill="#1a2332" stroke="#FF9900" stroke-width="1.5"/>
    <g class="rotate-logo" transform="translate(35,30)">
      <rect x="-16" y="-16" width="32" height="32" rx="4" fill="#232F3E"/>
      <text x="-13" y="6" font-size="11" fill="#FF9900" font-weight="bold">AWS</text>
    </g>
    <text x="35" y="62" text-anchor="middle" class="skill-label">AWS</text>
  </g>

  <!-- HTML -->
  <g class="pop-14 glow-pulse" transform="translate(420, 140)">
    <rect width="70" height="70" rx="12" fill="#1a2332" stroke="#E34F26" stroke-width="1.5"/>
    <g class="rotate-logo" transform="translate(35,30)">
      <circle r="18" fill="#E34F26"/>
      <text x="-13" y="6" font-size="10" fill="white" font-weight="bold">HTML</text>
    </g>
    <text x="35" y="62" text-anchor="middle" class="skill-label">HTML</text>
  </g>

  <!-- CSS -->
  <g class="pop-15 glow-pulse" transform="translate(500, 140)">
    <rect width="70" height="70" rx="12" fill="#1a2332" stroke="#1572B6" stroke-width="1.5"/>
    <g class="rotate-logo" transform="translate(35,30)">
      <circle r="18" fill="#1572B6"/>
      <text x="-10" y="6" font-size="11" fill="white" font-weight="bold">CSS</text>
    </g>
    <text x="35" y="62" text-anchor="middle" class="skill-label">CSS</text>
  </g>

  <!-- MongoDB -->
  <g class="pop-16 glow-pulse" transform="translate(580, 140)">
    <rect width="70" height="70" rx="12" fill="#1a2332" stroke="#47A248" stroke-width="1.5"/>
    <g class="rotate-logo" transform="translate(35,30)">
      <circle r="18" fill="#47A248"/>
      <text x="-6" y="6" font-size="13" fill="white" font-weight="bold">M</text>
    </g>
    <text x="35" y="62" text-anchor="middle" class="skill-label">MongoDB</text>
  </g>

  <!-- Row 3 - Express -->
  <g class="pop-17 glow-pulse" transform="translate(20, 225)">
    <rect width="70" height="70" rx="12" fill="#1a2332" stroke="#ffffff33" stroke-width="1.5"/>
    <g class="rotate-logo" transform="translate(35,30)">
      <rect x="-16" y="-16" width="32" height="32" rx="4" fill="#ffffff11"/>
      <text x="-14" y="6" font-size="9" fill="white" font-weight="bold">Express</text>
    </g>
    <text x="35" y="62" text-anchor="middle" class="skill-label">Express</text>
  </g>

  <!-- GitHub -->
  <g class="pop-18 glow-pulse" transform="translate(100, 225)">
    <rect width="70" height="70" rx="12" fill="#1a2332" stroke="#ffffff55" stroke-width="1.5"/>
    <g class="rotate-logo" transform="translate(35,30)">
      <circle r="18" fill="#24292e"/>
      <text x="-8" y="6" font-size="16" fill="white">🐙</text>
    </g>
    <text x="35" y="62" text-anchor="middle" class="skill-label">GitHub</text>
  </g>

</svg>
