<svg width="800" height="320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .section-title {
        font-family: monospace;
        font-size: 20px;
        font-weight: bold;
        fill: #ffffff;
      }
      .skill-label {
        font-family: monospace;
        font-size: 11px;
        fill: #8b949e;
      }
      .pop-1  { animation: popIn 0.4s ease-out 0.1s both; }
      .pop-2  { animation: popIn 0.4s ease-out 0.2s both; }
      .pop-3  { animation: popIn 0.4s ease-out 0.3s both; }
      .pop-4  { animation: popIn 0.4s ease-out 0.4s both; }
      .pop-5  { animation: popIn 0.4s ease-out 0.5s both; }
      .pop-6  { animation: popIn 0.4s ease-out 0.6s both; }
      .pop-7  { animation: popIn 0.4s ease-out 0.7s both; }
      .pop-8  { animation: popIn 0.4s ease-out 0.8s both; }
      .pop-9  { animation: popIn 0.4s ease-out 0.9s both; }
      .pop-10 { animation: popIn 0.4s ease-out 1.0s both; }
      .pop-11 { animation: popIn 0.4s ease-out 1.1s both; }
      .pop-12 { animation: popIn 0.4s ease-out 1.2s both; }
      .pop-13 { animation: popIn 0.4s ease-out 1.3s both; }
      .pop-14 { animation: popIn 0.4s ease-out 1.4s both; }
      .pop-15 { animation: popIn 0.4s ease-out 1.5s both; }
      .pop-16 { animation: popIn 0.4s ease-out 1.6s both; }
      .pop-17 { animation: popIn 0.4s ease-out 1.7s both; }
      .pop-18 { animation: popIn 0.4s ease-out 1.8s both; }
      .spin { animation: rotateSlow 10s linear infinite; transform-box: fill-box; transform-origin: center; }
      .glow { animation: glowBlink 3s ease-in-out infinite; }
      @keyframes popIn {
        0%   { opacity: 0; transform: scale(0.4); }
        70%  { transform: scale(1.08); }
        100% { opacity: 1; transform: scale(1); }
      }
      @keyframes rotateSlow {
        from { transform: rotate(0deg); }
        to   { transform: rotate(360deg); }
      }
      @keyframes glowBlink {
        0%, 100% { opacity: 0.75; }
        50%       { opacity: 1; }
      }
    </style>
    <clipPath id="c0"><rect width="44" height="44" rx="10"/></clipPath>
  </defs>

  <text x="20" y="35" class="section-title">&lt;/&gt; Skills</text>

  <!-- ROW 1 -->
  <g class="pop-1 glow" transform="translate(20,50)">
    <rect width="70" height="80" rx="12" fill="#161b22" stroke="#3572A5" stroke-width="1.5"/>
    <g transform="translate(13,8)" clip-path="url(#c0)">
      <rect width="44" height="44" rx="10" fill="#3572A5"/>
      <g class="spin" transform="translate(22,22)"><text x="-10" y="7" font-size="16" fill="white" font-weight="bold" font-family="monospace">Py</text></g>
    </g>
    <text x="35" y="70" text-anchor="middle" class="skill-label">Python</text>
  </g>

  <g class="pop-2 glow" transform="translate(100,50)">
