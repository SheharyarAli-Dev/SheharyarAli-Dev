<svg width="900" height="160" viewBox="0 0 900 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes slideIn  { from { opacity:0; transform:translateX(-30px) } to { opacity:1; transform:translateX(0) } }
      @keyframes fadeUp   { from { opacity:0; transform:translateY(12px)  } to { opacity:1; transform:translateY(0) } }
      @keyframes blink    { 0%,100%{opacity:1} 50%{opacity:0} }
      @keyframes nameGlow { 0%,100%{filter:drop-shadow(0 0 3px rgba(0,180,216,.2))} 50%{filter:drop-shadow(0 0 9px rgba(0,180,216,.5))} }
      @keyframes barGrow  { from{width:0} to{width:460px} }
      @keyframes promptIn { from{opacity:0} to{opacity:1} }

      .prompt  { font-family:'Fira Code','Courier New',monospace; font-size:12px; fill:#4a5568;
                 animation: promptIn .3s ease-out .1s both; }
      .hi      { font-family:'Fira Code','Courier New',monospace; font-size:20px; fill:#8b949e;
                 animation: slideIn .6s cubic-bezier(.22,1,.36,1) .25s both; }
      .name    { font-family:'Fira Code','Courier New',monospace; font-size:42px; font-weight:700; fill:#e6edf3;
                 animation: slideIn .7s cubic-bezier(.22,1,.36,1) .4s both; }
      .cyan    { fill:#00b4d8; animation: slideIn .7s cubic-bezier(.22,1,.36,1) .4s both, nameGlow 4s ease-in-out 1.2s infinite; }
      .cursor  { animation: blink 1.05s step-end 1.1s infinite; }
      .bar     { animation: barGrow .8s cubic-bezier(.22,1,.36,1) .9s both; }
      .tag     { font-family:'Fira Code','Courier New',monospace; font-size:13px; fill:#6e7681;
                 animation: fadeUp .5s ease-out 1s both; }
      .dot     { fill:#00b4d8; animation: fadeUp .5s ease-out 1.1s both; }
    </style>
  </defs>

  <!-- prompt -->
  <text class="prompt" x="2" y="28">~/SheharyarAli-Dev  on  main  ❯</text>

  <!-- Hi line -->
  <text class="hi" x="2" y="62">Hi there 👋</text>

  <!-- Name -->
  <text class="name" x="2" y="112">
    I'm <tspan class="cyan">Sheharyar Ali</tspan>
  </text>

  <!-- blinking cursor -->
  <rect class="cursor" x="386" y="80" width="3" height="36" fill="#00b4d8" rx="1"/>

  <!-- accent bar -->
  <rect class="bar" x="0" y="120" height="1.5" fill="#00b4d8" opacity=".4" rx="1"/>

  <!-- tagline with dots -->
  <circle class="dot" cx="6"   cy="142" r="3"/>
  <circle class="dot" cx="6"   cy="142" r="3" opacity=".0" style="animation-delay:1.15s"/>
  <text class="tag" x="18" y="147">Full Stack Developer</text>
  <text class="tag" x="198" y="147" fill="#00b4d8">·</text>
  <text class="tag" x="214" y="147">AI Systems Builder</text>
  <text class="tag" x="372" y="147" fill="#00b4d8">·</text>
  <text class="tag" x="388" y="147">FAST-NUCES, Islamabad</text>
</svg>
