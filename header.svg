<svg width="800" height="120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&amp;display=swap');
      
      .title {
        font-family: 'Fira Code', monospace;
        font-size: 32px;
        font-weight: 700;
        fill: #ffffff;
        filter: url(#glow);
      }
      .subtitle {
        font-family: 'Fira Code', monospace;
        font-size: 16px;
        fill: #58a6ff;
        filter: url(#glowBlue);
      }

      .title-text {
        animation: slideIn 1s ease-out forwards, glowPulse 3s ease-in-out 1s infinite;
        opacity: 0;
      }
      .subtitle-text {
        animation: slideIn 1s ease-out 0.5s forwards, glowPulseBlue 3s ease-in-out 1.5s infinite;
        opacity: 0;
      }

      @keyframes slideIn {
        0% { opacity: 0; transform: translateX(-40px); }
        100% { opacity: 1; transform: translateX(0); }
      }

      @keyframes glowPulse {
        0%, 100% { filter: url(#glowLow); }
        50% { filter: url(#glowHigh); }
      }

      @keyframes glowPulseBlue {
        0%, 100% { filter: url(#glowBlueLow); }
        50% { filter: url(#glowBlueHigh); }
      }
    </style>

    <filter id="glowLow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowHigh" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowBlueLow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowBlueHigh" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="120" fill="#0d1117" rx="10"/>

  <text x="30" y="55" class="title title-text">Hi 👋, I'm Sheharyar Ali</text>
  <text x="30" y="90" class="subtitle subtitle-text">🚀 Full Stack Developer | AI Systems Builder</text>
</svg>
