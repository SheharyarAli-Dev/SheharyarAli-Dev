<svg width="860" height="140" viewBox="0 0 860 140" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes slideRight {
        0%   { opacity: 0; transform: translateX(-32px); }
        100% { opacity: 1; transform: translateX(0); }
      }
      @keyframes fadeUp {
        0%   { opacity: 0; transform: translateY(10px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50%       { opacity: 0; }
      }
      @keyframes subtleGlow {
        0%, 100% { filter: drop-shadow(0 0 4px rgba(0,180,216,0.25)); }
        50%       { filter: drop-shadow(0 0 10px rgba(0,180,216,0.45)); }
      }
      @keyframes promptFade {
        0%   { opacity: 0; }
        100% { opacity: 1; }
      }

      .prompt     { animation: promptFade 0.4s ease-out 0.1s both; }
      .name       { animation: slideRight 0.7s cubic-bezier(0.22,1,0.36,1) 0.3s both, subtleGlow 4s ease-in-out 1.2s infinite; }
      .tagline    { animation: fadeUp 0.6s ease-out 0.8s both; }
      .cursor     { animation: blink 1.1s step-end 1.4s infinite; }
      .underline  { animation: fadeUp 0.5s ease-out 1s both; }
    </style>
  </defs>

  <!-- Transparent background -->

  <!-- Prompt line -->
  <text class="prompt" x="0" y="38"
    font-family="'Fira Code', 'Cascadia Code', 'Courier New', monospace"
    font-size="13" fill="#4a5568" letter-spacing="0.5">
    ~/SheharyarAli-Dev  ❯
  </text>

  <!-- Name -->
  <text class="name" x="0" y="88"
    font-family="'Fira Code', 'Cascadia Code', 'Courier New', monospace"
    font-size="38" font-weight="700" fill="#e6edf3" letter-spacing="-0.5">
    Hi 👋  I'm <tspan fill="#00b4d8">Sheharyar Ali</tspan>
  </text>

  <!-- Blinking cursor after name -->
  <rect class="cursor" x="534" y="60" width="3" height="32" fill="#00b4d8" rx="1"/>

  <!-- Thin accent line -->
  <rect class="underline" x="0" y="100" width="420" height="1" fill="#00b4d8" opacity="0.35" rx="1"/>

  <!-- Tagline -->
  <text class="tagline" x="0" y="126"
    font-family="'Fira Code', 'Cascadia Code', 'Courier New', monospace"
    font-size="14" fill="#8b949e" letter-spacing="0.3">
    🚀 Full Stack Developer  ·  AI Systems Builder  ·  FAST-NUCES
  </text>
</svg>
